name: Auto Publish Japanese Videos - Velocity Japanese

on:
  schedule:
    - cron: '0 3 * * *'    # 3:00 AM UTC
    - cron: '0 11 * * *'   # 11:00 AM UTC
    - cron: '0 19 * * *'   # 7:00 PM UTC
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish-videos:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Check required secrets
        run: |
          echo "Checking required environment variables..."
          echo ""
          echo "=== CRITICAL SECRETS ==="
          if [ -z "${GOOGLE_DRIVE_FOLDER_ID}" ]; then
            echo "Missing: GOOGLE_DRIVE_FOLDER_ID"
          else
            echo "Found: GOOGLE_DRIVE_FOLDER_ID"
          fi

          if [ -z "${GOOGLE_SERVICE_ACCOUNT_KEY}" ]; then
            echo "Missing: GOOGLE_SERVICE_ACCOUNT_KEY"
          else
            echo "Found: GOOGLE_SERVICE_ACCOUNT_KEY"
          fi

          echo ""
          echo "=== FACEBOOK SECRETS ==="
          if [ -z "${FACEBOOK_ACCESS_TOKEN}" ]; then
            echo "❌ ERROR: FACEBOOK_ACCESS_TOKEN secret is not set!"
            echo "   Please add FACEBOOK_ACCESS_TOKEN in https://github.com/eternityrage/vel-jap-vids/settings/secrets/actions"
            exit 1
          else
            echo "Found: FACEBOOK_ACCESS_TOKEN"
          fi

          if [ -z "${FACEBOOK_PAGE_ID}" ]; then
            echo "❌ ERROR: FACEBOOK_PAGE_ID secret is not set!"
            echo "   Please add FACEBOOK_PAGE_ID in https://github.com/eternityrage/vel-jap-vids/settings/secrets/actions"
            exit 1
          else
            echo "Found: FACEBOOK_PAGE_ID"
          fi

          echo ""
          echo "=== AI CAPTIONS ==="
          if [ -z "${POLLINATIONS_API_KEY}" ]; then
            echo "Note: POLLINATIONS_API_KEY not set - will use rich Japanese fallback captions"
          else
            echo "Found: POLLINATIONS_API_KEY"
          fi
        env:
          GOOGLE_DRIVE_FOLDER_ID: ${{ secrets.GOOGLE_DRIVE_FOLDER_ID }}
          GOOGLE_SERVICE_ACCOUNT_KEY: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_KEY }}
          FACEBOOK_ACCESS_TOKEN: ${{ secrets.FACEBOOK_ACCESS_TOKEN }}
          FACEBOOK_PAGE_ID: ${{ secrets.FACEBOOK_PAGE_ID }}
          POLLINATIONS_API_KEY: ${{ secrets.POLLINATIONS_API_KEY }}

      - name: Run automation pipeline
        env:
          GOOGLE_DRIVE_FOLDER_ID: ${{ secrets.GOOGLE_DRIVE_FOLDER_ID }}
          GOOGLE_SERVICE_ACCOUNT_KEY: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_KEY }}
          FACEBOOK_ACCESS_TOKEN: ${{ secrets.FACEBOOK_ACCESS_TOKEN }}
          FACEBOOK_PAGE_ID: ${{ secrets.FACEBOOK_PAGE_ID }}
          POLLINATIONS_API_KEY: ${{ secrets.POLLINATIONS_API_KEY }}
          AI_MODEL: openai
          INSTAGRAM_ACCESS_TOKEN: ${{ secrets.INSTAGRAM_ACCESS_TOKEN }}
          INSTAGRAM_ACCOUNT_ID: ${{ secrets.INSTAGRAM_ACCOUNT_ID }}
          THREADS_ACCESS_TOKEN: ${{ secrets.THREADS_ACCESS_TOKEN }}
          THREADS_USER_ID: ${{ secrets.THREADS_USER_ID }}
        run: |
          echo "Starting automation pipeline - Velocity Japanese..."
          python auto_pipeline.py
          exit_code=$?

          if [ $exit_code -ne 0 ]; then
            echo "Pipeline failed with exit code $exit_code"
            exit $exit_code
          fi

          echo "Pipeline completed successfully"

      - name: Commit published videos log
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"

          git add published_videos.json 2>/dev/null || true

          if ! git diff --staged --quiet; then
            git commit -m "Update published videos log [skip ci]"
            git pull --rebase
            git push
            echo "Committed and pushed published_videos.json"
          else
            echo "No changes to commit"
          fi
